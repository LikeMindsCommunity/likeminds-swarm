apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "swarm-prod"
  namespace: "app-deploy"
  labels:
    app: "swarm-prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "swarm-prod"
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1  
  template:
    metadata:
      labels:
        app: "swarm-prod"
    spec:
      containers:
      - name: "likeminds-swarm-prod-1"
        image: "asia.gcr.io/likeminds-prod-prj-5464/likeminds-swarm/swarm-prod:a22ed32"
        resources:
          requests:
            memory: "1000Mi"
            cpu: "2000m"
        limits:
          memory: "3000Mi"
          cpu: "2500m"

---

apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "swarm-prod"
  namespace: "app-deploy"
  labels:
    app: "swarm-prod"
spec:
  scaleTargetRef:
    kind: "Deployment"
    name: "swarm-prod"
    apiVersion: "apps/v1"
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: "Resource"
    resource:
      name: "cpu"
      target:
        type: "Utilization"
        averageUtilization: 75
