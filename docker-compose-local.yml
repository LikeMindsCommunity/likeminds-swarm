services:
  swarm_mongodb:
    image: mongo:latest
    container_name: swarm_mongodb
    ports:
      - 27017:27017
    volumes:
      - swarm_mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    networks:
      - likeminds-network

  swarm_redis:
    image: redis:latest
    container_name: swarm_redis
    ports:
      - "6382:6379"
    networks:
      - likeminds-network

  swarm_worker_redis:
    image: redis:latest
    container_name: swarm_worker_redis
    ports:
      - "6383:6379"
    networks:
      - likeminds-network

  swarm:
    container_name: swarm
    hostname: swarm
    build:
      dockerfile: ./Dockerfile.swarm-beta
    ports:
      - 8081:8081
    environment:
      - REDIS_DSN=swarm_redis:6379
      - ASYNQ_BROKER_ADDRESS=swarm_worker_redis:6379
      - MONGODB_URI=mongodb://root:example@swarm_mongodb:27017/
      - CARAVAN_SERVICE_URL=http://caravan:8000
      - KETTLE_SERVICE_URL=http://auth:8080
      - ELASTIC_SEARCH_HOST=caravan_elasticsearch
    restart: unless-stopped
    networks:
      - likeminds-network
    depends_on:
      - swarm_mongodb
      - swarm_redis
      - swarm_worker_redis
      - caravan_elasticsearch

  swarm_worker:
    container_name: swarm_worker
    hostname: swarm_worker
    build:
      dockerfile: ./Dockerfile.swarm-worker-beta
    environment:
      - REDIS_DSN=swarm_redis:6379
      - ASYNQ_BROKER_ADDRESS=swarm_worker_redis:6379
      - MONGODB_URI=mongodb://root:example@swarm_mongodb:27017/
      - CARAVAN_SERVICE_URL=http://caravan:8000
      - KETTLE_SERVICE_URL=http://auth:8080
      - ELASTIC_SEARCH_HOST=caravan_elasticsearch
    restart: unless-stopped
    networks:
      - likeminds-network
    depends_on:
      - swarm_mongodb
      - swarm_redis
      - swarm_worker_redis
      - caravan_elasticsearch

networks:
  likeminds-network:
    external: true

volumes:
  swarm_mongodb_data:
    driver: local
