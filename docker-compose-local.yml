services:
  swarm_mongodb:
    image: mongo:latest
    container_name: swarm_mongodb
    ports:
      - 27017:27017
    volumes:
      - swarm_mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    networks:
      - likeminds-network

  swarm_redis:
    image: redis:latest
    container_name: swarm_redis
    ports:
      - "6382:6379"
    networks:
      - likeminds-network

  swarm_worker_redis:
    image: redis:latest
    container_name: swarm_worker_redis
    ports:
      - "6383:6379"
    networks:
      - likeminds-network

  swarm_elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.13.0
    container_name: swarm_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - 9201:9200
    restart: unless-stopped
    networks:
      - likeminds-network

  swarm:
    container_name: swarm
    hostname: swarm
    build:
      dockerfile: ./Dockerfile.swarm-beta
    ports:
      - 8081:8081
    networks:
      - likeminds-network
    depends_on:
      - swarm_mongodb
      - swarm_redis
      - swarm_worker_redis
      - swarm_elasticsearch

  swarm_worker:
    container_name: swarm_worker
    hostname: swarm_worker
    build:
      dockerfile: ./Dockerfile.swarm-worker-beta
    restart: unless-stopped
    networks:
      - likeminds-network
    depends_on:
      - swarm_mongodb
      - swarm_redis
      - swarm_worker_redis
      - swarm_elasticsearch

networks:
  likeminds-network:
    external: true

volumes:
  swarm_mongodb_data:
    driver: local
